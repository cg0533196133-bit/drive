<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדפדפן המרוחק שלי</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            font-family: sans-serif;
            color: white;
        }
        #setup-container {
            padding: 20px;
            text-align: center;
        }
        input {
            width: 60%;
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
    </style>
</head>
<body>

    <div id="setup-container">
        <h2>התחברות למסך המרוחק</h2>
        <p>הדבק כאן את קישור ה-ngrok שקיבלת בלוגים של GitHub:</p>
        <input type="text" id="ngrok-url" placeholder="https://xxxx.ngrok-free.dev">
        <button onclick="loadScreen()">התחבר</button>
    </div>

    <iframe id="remote-screen" src=""></iframe>

    <script>
        function loadScreen() {
            const url = document.getElementById('ngrok-url').value.trim();
            if (url) {
                document.getElementById('setup-container').style.display = 'none';
                const iframe = document.getElementById('remote-screen');
                iframe.src = url;
                iframe.style.display = 'block';
            } else {
                alert('נא להזין קישור תקין');
            }
        }
    </script>

</body>
</html>
