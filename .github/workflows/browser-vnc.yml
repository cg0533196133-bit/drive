name: Interactive Browser Remote Access

on:
  workflow_dispatch:

jobs:
  interactive-browser:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Display and Browser Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc fluxbox novnc python3-websockify google-chrome-stable jq

      - name: Start Virtual Display & VNC Server
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          fluxbox &
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &

      - name: Start ngrok Tunnel in Background
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # התקנת ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          
          # הגדרת ה-Authtoken
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # הפעלת ngrok ברקע
          nohup ngrok http 6080 > /dev/null 2>&1 &
          
          # המתנה ליצירת החיבור ושליפת ה-URL דרך ה-API המקומי
          echo "Waiting for ngrok URL..."
          URL=""
          for i in {1..30}; do
            URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url' 2>/dev/null)
            if [ "$URL" != "null" ] && [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done
          
          # הדפסת הקישור למסך
          echo "=========================================="
          echo "Your noVNC URL:"
          echo "$URL"
          echo "=========================================="

      - name: Keep Workflow Alive
        run: |
          echo "The server is active and running. Access your link above."
          tail -f /dev/null
