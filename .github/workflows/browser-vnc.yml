name: Interactive Browser Remote Access

on:
  workflow_dispatch: # הפעלה ידנית בלשונית Actions

jobs:
  interactive-browser:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Display and Browser Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc fluxbox novnc python3-websockify google-chrome-stable

      - name: Start Virtual Display & VNC Server
        run: |
          # הפעלת מסך וירטואלי (Xvfb)
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          
          # הפעלת מנהל חלונות בסיסי
          fluxbox &
          
          # הפעלת שרת VNC
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &
          
          # הפעלת noVNC בפורט 6080
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &

      - name: Start Interactive Session (Upterm)
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: false
