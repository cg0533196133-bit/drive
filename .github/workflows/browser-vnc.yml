name: Interactive Browser Remote Access

on:
  workflow_dispatch:

jobs:
  interactive-browser:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Display and Browser Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc fluxbox novnc python3-websockify google-chrome-stable

      - name: Start Virtual Display & VNC Server
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          fluxbox &
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &
          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &

      - name: Install and Start ngrok Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # התקנת ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          
          # הגדרת ה-Authtoken
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # הפעלת ngrok ברקע והפניית הלוגים לקובץ
          ngrok http 6080 --log=stdout > ngrok.log 2>&1 &
          
          # המתנה של 5 שניות ליצירת החיבור
          sleep 5
          
          # חילוץ הקישור והדפסתו פעם אחת בלבד
          echo "=========================================="
          echo "Your noVNC URL:"
          grep -o 'https://[^"]*ngrok-free.app' ngrok.log | head -n 1
          echo "=========================================="
          
          # שמירה על הג'וב פעיל מבלי להדפיס לוגים
          tail -f /dev/null
